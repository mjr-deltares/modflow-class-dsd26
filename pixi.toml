[workspace]
name = "modflow-class-dsd26"
version = "2026.0.0"
description = "Class materials for the 2026 MODFLOW 6 advanced class at the DSD in Delft"
channels = ["conda-forge"]
# the platforms the class MODFLOW 6 release is built for, with macOS 14 or later
# for the pypestutils wheel
platforms = [
    "win-64",
    "linux-64",
    { name = "osx-arm64-14", platform = "osx-arm64", macos = "14.0" },
]

# The MODFLOW 6 environment is a feature so that other environments (the GMDSI
# notebooks, later) can sit beside it; the default environment is made from it.
[environments]
default = { features = ["mf6"], solve-group = "mf6" }

[feature.mf6.dependencies]
python = "3.12.*"
git = "*"
numpy = "*"
# below 3 for pyemu
pandas = ">=2.3.3,<3"
matplotlib = "*"
scipy = "*"
jupyterlab = "*"
notebook = "*"
ipywidgets = "*"
shapely = ">=2.0"
rtree = "*"
pyproj = "*"
pyshp = "*"
geopandas = "*"
rasterio = "*"
rasterstats = "*"
xarray = "*"
netcdf4 = "*"
pyvista = "*"
h5py = "*"
modflowapi = "*"
# PEST++, for parameter estimation and uncertainty analysis
pestpp = "*"
# what flopy's generate_classes needs to make the MODFLOW 6 classes from DFN
# files (flopy's `codegen` extra)
jinja2 = "*"
boltons = "*"
modflow-devtools = ">=1.7.0,!=1.9.0,<2"
tomli = "*"
tomli-w = "*"
# the pre-commit hook: nbstripout clears notebook outputs, codespell fixes
# spelling, and ruff lints and formats (see .pre-commit-config.yaml)
ruff = "*"
nbstripout = "*"
codespell = "*"
pre-commit = "*"

[feature.mf6.pypi-dependencies]
# flopy's develop branch, for the SWI and VSF support the class MODFLOW 6 needs
flopy = { git = "https://github.com/modflowpy/flopy.git", branch = "develop" }
# pyEMU from PyPI, since the conda-forge package requires the conda-forge flopy
# and is older; and the PEST utilities, for pilot points
pyemu = ">=1.7"
pypestutils = "*"

[feature.mf6.tasks]
# --- getting started -------------------------------------------------------
setup = { depends-on = [
    "install",
    "verify",
], description = "Install MODFLOW 6, then check that it and PEST++ start" }

# MODFLOW 6 from the class release, with flopy's classes generated from its DFN
# files, and the git pre-commit hook
install = { depends-on = [
    "get-mf6",
    "pre-commit-install",
], description = "Install MODFLOW 6 and the git pre-commit hook" }
get-mf6 = { cmd = "python scripts/get_mf6.py", description = "Install the class MODFLOW 6 and generate the flopy classes for it" }
update-mf6 = { cmd = "python scripts/get_mf6.py --update", description = "Install the latest class MODFLOW 6 if it is newer" }

# Run the programs, which proves they start on this machine.
verify = { cmd = "python scripts/verify_probe.py mf6 zbud6 pestpp-ies", description = "Check that MODFLOW 6 and PEST++ start" }

# --- day-to-day ------------------------------------------------------------
jupyter = { cmd = "jupyter lab", description = "Start JupyterLab" }

help = { cmd = "pixi task list", description = "List every command" }

# --- contributing ----------------------------------------------------------
pre-commit-install = { cmd = "pre-commit install", description = "Install the git pre-commit hook that clears notebook outputs, fixes spelling, and lints" }
pre-commit-run = { cmd = "pre-commit run --all-files", description = "Run the pre-commit hooks on every file" }

# pyemu needs an older numpy on Linux
[feature.mf6.target.linux-64.dependencies]
numpy = ">=2.2.6,<2.3.2"

# Regenerate flopy's MODFLOW 6 classes after a reinstall of flopy puts back the
# ones it ships. Quick and offline when nothing has changed.
[feature.mf6.target.unix.activation]
scripts = ["scripts/activate.sh"]

[feature.mf6.target.win-64.activation]
scripts = ["scripts/activate.bat"]
