name: 2 · Run class model (Windows, macOS, Linux)
# Installs the class environment the way a student does and runs the coastal
# synthetic-valley base model with its mf6, on each platform the class uses.
# Then runs the MODFLOW 6 API notebooks a to d, which load the mf6 shared
# library (its name and folder differ by platform); e and f take too long.
# Then runs the SWI notebook mf6-swi-buy-a and the VSF notebook
# vsf-1-surface-boundary; mf6-swi-buy-b, synthetic-valley-h-swi, and
# vsf-2-synthetic-valley take too long.
concurrency:
  group: model-run-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - 'pixi.toml'
      - 'pixi.lock'
      - 'scripts/**'
      - 'examples/data/synthetic-valley/synthetic-valley-coastal-base-annual/**'
      - 'examples/notebooks/mf6-api-[a-d]-*.ipynb'
      - 'examples/notebooks/mf6_api_helpers.py'
      - 'examples/notebooks/mf6-swi-buy-a.ipynb'
      - 'examples/notebooks/vsf-1-surface-boundary.ipynb'
      - 'examples/notebooks/sv_notebook_helpers.py'
      - '.github/workflows/model-run.yml'
  push:
    branches:
      - main
    paths:
      - 'pixi.toml'
      - 'pixi.lock'
      - 'scripts/**'
      - 'examples/data/synthetic-valley/synthetic-valley-coastal-base-annual/**'
      - 'examples/notebooks/mf6-api-[a-d]-*.ipynb'
      - 'examples/notebooks/mf6_api_helpers.py'
      - 'examples/notebooks/mf6-swi-buy-a.ipynb'
      - 'examples/notebooks/vsf-1-surface-boundary.ipynb'
      - 'examples/notebooks/sv_notebook_helpers.py'
      - '.github/workflows/model-run.yml'
  # each new class MODFLOW 6 release
  workflow_run:
    workflows: ['1 · Build class MODFLOW 6 (nightly)']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
env:
  MODEL: examples/data/synthetic-valley/synthetic-valley-coastal-base-annual
jobs:
  run:
    name: Run model and API notebooks (${{ matrix.os }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pixi and install the locked environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          locked: true
          cache: true

      - name: Install the class MODFLOW 6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pixi run setup

      - name: Run the model
        working-directory: ${{ env.MODEL }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pixi run --manifest-path "${GITHUB_WORKSPACE}/pixi.toml" mf6
          grep -q "Normal termination" mfsim.lst

      - name: Run the MODFLOW 6 API notebooks (a to d)
        working-directory: examples/notebooks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for notebook in mf6-api-a-basic mf6-api-b-convergence \
            mf6-api-c-recharge-callback mf6-api-d-reverse-drain; do
            pixi run --manifest-path "${GITHUB_WORKSPACE}/pixi.toml" jupyter-nbconvert \
              --to notebook --execute --output-dir "${RUNNER_TEMP}/api-notebooks" \
              "${notebook}.ipynb"
          done

      - name: Run the SWI and VSF notebooks (mf6-swi-buy-a, vsf-1)
        working-directory: examples/notebooks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for notebook in mf6-swi-buy-a vsf-1-surface-boundary; do
            pixi run --manifest-path "${GITHUB_WORKSPACE}/pixi.toml" jupyter-nbconvert \
              --to notebook --execute --output-dir "${RUNNER_TEMP}/swi-vsf-notebooks" \
              "${notebook}.ipynb"
          done
