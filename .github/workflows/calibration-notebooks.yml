name: 3 · Run calibration notebooks
# Installs the class environment with pixi and runs the PEST++ IES notebook
# (f) of the synthetic valley, shortened to two IES iterations on 4 workers. Notebook f runs
# the PEST interface that notebook e builds, so e runs first.
concurrency:
  group: calibration-notebooks-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - 'pixi.toml'
      - 'pixi.lock'
      - 'scripts/**'
      - 'examples/notebooks/**'
      - 'examples/data/synthetic-valley/**'
      - '.github/workflows/calibration-notebooks.yml'
  push:
    branches:
      - main
    paths:
      - 'pixi.toml'
      - 'pixi.lock'
      - 'scripts/**'
      - 'examples/notebooks/**'
      - 'examples/data/synthetic-valley/**'
      - '.github/workflows/calibration-notebooks.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  NOTEBOOKS: examples/notebooks
jobs:
  ies:
    name: Run PEST++ IES (notebooks e and f)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pixi and install the locked environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          locked: true
          cache: true

      - name: Install the class MODFLOW 6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pixi run setup

      - name: Shorten the IES run to noptmax = 2 with 4 workers
        working-directory: ${{ env.NOTEBOOKS }}
        run: |
          set_value() {
            pixi run --manifest-path "${GITHUB_WORKSPACE}/pixi.toml" python \
              "${GITHUB_WORKSPACE}/.github/scripts/set_notebook_value.py" \
              synthetic-valley-f-pestpp-ies.ipynb "$1" "$2"
          }
          set_value noptmax 2
          set_value num_workers 4

      - name: Build the PEST interface (notebook e)
        working-directory: ${{ env.NOTEBOOKS }}
        run: >-
          pixi run --manifest-path "${GITHUB_WORKSPACE}/pixi.toml" jupyter-nbconvert
          --to notebook --execute --inplace --ExecutePreprocessor.timeout=-1
          synthetic-valley-e-pest-interface.ipynb

      - name: Run PEST++ IES (notebook f)
        working-directory: ${{ env.NOTEBOOKS }}
        run: >-
          pixi run --manifest-path "${GITHUB_WORKSPACE}/pixi.toml" jupyter-nbconvert
          --to notebook --execute --inplace --ExecutePreprocessor.timeout=-1
          synthetic-valley-f-pestpp-ies.ipynb

      - name: Check that IES ran two iterations
        working-directory: ${{ env.NOTEBOOKS }}/models/sv-ies-master
        run: |
          ls pest.*.csv
          test -f pest.2.obs.csv
          test -f pest.2.par.csv

      - name: Upload the executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-notebooks
          path: |
            ${{ env.NOTEBOOKS }}/synthetic-valley-e-pest-interface.ipynb
            ${{ env.NOTEBOOKS }}/synthetic-valley-f-pestpp-ies.ipynb
            ${{ env.NOTEBOOKS }}/models/sv-ies-master/pest.rec
          if-no-files-found: ignore
